<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery — Art Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5eeee;
            color: #222;
        }

        /* NAVBAR UTAMA */
        header {
            width: 100%;
            padding: 24px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8dddd;
            background: #f5eeee;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 35px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            opacity: 0.5;
        }

        nav a.active {
            font-weight: 600;
        }


        /* JUDUL GALLERY */
        .gallery-header {
            text-align: center;
            padding: 80px 20px 45px;
        }

        .gallery-header h1 {
            font-size: 42px;
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .gallery-header p {
            font-size: 16px;
            color: #777;
        }


        /* NAVBAR KATEGORI */
        .category-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;

            padding: 18px 20px;
            margin: 0 auto 80px;

            border-top: 1px solid #e8dddd;
            border-bottom: 1px solid #e8dddd;

            position: sticky;
            top: 75px;

            background: rgba(245, 238, 238, 0.96);
            backdrop-filter: blur(8px);

            z-index: 90;
        }

        .category-nav a {
            text-decoration: none;
            color: #333;

            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;

            transition: 0.3s;
        }

        .category-nav a:hover {
            opacity: 0.5;
        }


        /* BAGIAN KATEGORI */
        .category-section {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto 100px;

            scroll-margin-top: 150px;
        }

        .category-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .category-title h2 {
            font-size: 28px;
            font-weight: 500;
            letter-spacing: 2px;
        }


        /* ARTWORK */
        .artwork {
            width: 100%;
            max-width: 720px;

            margin: 0 auto 70px;

            position: relative;
            overflow: hidden;

            border-radius: 22px;
            background: #eee;
        }

        .artwork img {
            width: 100%;
            height: auto;

            display: block;

            transition: transform 0.5s ease;
        }

        .artwork:hover img {
            transform: scale(1.025);
        }


        /* INFO DI ATAS GAMBAR */
        .artwork-info {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            padding: 80px 30px 25px;

            color: white;

            background: linear-gradient(
                transparent,
                rgba(0, 0, 0, 0.72)
            );

            opacity: 0;

            transform: translateY(10px);

            transition: 0.3s;
        }

        .artwork:hover .artwork-info {
            opacity: 1;
            transform: translateY(0);
        }

        .artwork-info small {
            font-size: 12px;
            letter-spacing: 1.5px;
        }

        .artwork-info h2 {
            font-size: 22px;
            font-weight: 500;
            margin-top: 6px;
        }


        /* FOOTER */
        footer {
            text-align: center;

            padding: 50px 20px;

            border-top: 1px solid #e8dddd;

            color: #888;

            font-size: 14px;
        }


        /* HP */
        @media (max-width: 700px) {

            header {
                padding: 20px;
            }

            .logo {
                font-size: 17px;
            }

            nav {
                gap: 18px;
            }

            nav a {
                font-size: 14px;
            }

            .gallery-header {
                padding: 60px 20px 35px;
            }

            .gallery-header h1 {
                font-size: 32px;
            }

            .category-nav {
                gap: 18px;
                padding: 18px 10px;
                top: 63px;
            }

            .category-nav a {
                font-size: 13px;
            }

            .category-section {
                width: 92%;
            }

            .category-title h2 {
                font-size: 24px;
            }

            .artwork {
                border-radius: 18px;
            }

            .artwork-info h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR UTAMA -->
    <header>

        <div class="logo">
            ART GALLERY
        </div>

        <nav>
            <a href="index.html">
                Home
            </a>

            <a href="gallery.html" class="active">
                Gallery
            </a>

            <a href="about.html">
                About
            </a>
        </nav>

    </header>


    <!-- JUDUL -->
    <section class="gallery-header">

        <h1>My Works</h1>

        <p>
            A collection of my artworks
        </p>

    </section>


    <!-- NAVBAR KATEGORI -->
    <div class="category-nav">

        <a href="#pencil">
            B&amp;W / PENCIL
        </a>

        <a href="#painting">
            PAINTING
        </a>

        <a href="#digital">
            DIGITAL ART
        </a>

    </div>


    <!-- B&W / PENCIL -->
    <section class="category-section" id="pencil">

        <div class="category-title">
            <h2>B&amp;W / PENCIL</h2>
        </div>

        <div class="artwork">

            <img
                src="foto1.jpeg"
                alt="Portrait Study"
            >

            <div class="artwork-info">

                <small>
                    B&amp;W / PENCIL
                </small>

                <h2>
                    Portrait Study
                </h2>

            </div>

        </div>

    </section>


    <!-- PAINTING -->
    <section class="category-section" id="painting">

        <div class="category-title">
            <h2>PAINTING</h2>
        </div>

        <!-- Tambahkan karya painting di sini -->

    </section>


    <!-- DIGITAL ART -->
    <section class="category-section" id="digital">

        <div class="category-title">
            <h2>DIGITAL ART</h2>
        </div>

        <!-- Tambahkan karya digital art di sini -->

    </section>


    <!-- FOOTER -->
    <footer>

        © 2026 Art Gallery

    </footer>

</body>
</html>
