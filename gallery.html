<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — 0urnss</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f5eeee;
    color: #222;
}

/* ================= HEADER ================= */

header {
    height: 75px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #eee;
}

nav {
    display: flex;
    gap: 45px;
}

nav a {
    text-decoration: none;
    color: #222;
    font-size: 14px;
    letter-spacing: 1px;
    transition: 0.3s;
}

nav a:hover {
    color: #a88989;
}

/* ================= GALLERY HEADER ================= */

.gallery-header {
    text-align: center;
    padding: 70px 20px 35px;
    position: relative;
    z-index: 10;
}

.gallery-header h1 {
    font-size: 38px;
    font-weight: 400;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.gallery-header p {
    font-size: 14px;
    color: #777;
}

/* ================= CATEGORY NAV ================= */

.category-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px auto 60px;
    position: relative;
    z-index: 10;
}

.category-nav a {
    color: #555;
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 0 22px;
    transition: 0.3s;
}

.category-nav a:hover {
    color: #111;
}

.category-nav span {
    color: #bbb;
}

/* ================= CATEGORY ================= */

.category {
    width: 90%;
    max-width: 1000px;
    margin: 0 auto 100px;
    position: relative;
    z-index: 10;
}

.category-title {
    text-align: center;
    margin-bottom: 35px;
}

.category-title h2 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
}

/* ================= ARTWORK ================= */

.artwork {
    position: relative;
    width: 100%;
    margin: 0 auto 55px;
    z-index: 20;
}

.artwork img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 850px;
    object-fit: contain;
    border-radius: 16px;
}

/* ================= INFO SELALU TERLIHAT ================= */

.artwork-info {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;

    padding: 90px 30px 28px;

    color: white;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0),
        rgba(0,0,0,0.72)
    );

    opacity: 1;
    visibility: visible;
    transform: translateY(0);

    z-index: 21;
    pointer-events: none;
    border-radius: 0 0 16px 16px;
}

.artwork-info small {
    display: block;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 7px;
    opacity: 0.9;
}

.artwork-info h2 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 1px;
}

/* ================= DECORATION ================= */

#clover-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}

/* Bentuk dekorasi CSS */
.clover {
    position: absolute;
    width: 18px;
    height: 18px;
    opacity: 0.55;
    animation: float 7s linear forwards;
}

/* Bentuk daun 4 bagian */
.clover::before,
.clover::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 9px;
    background: #9caf88;
    border-radius: 50%;
}

.clover::before {
    left: 0;
    top: 4px;
    box-shadow:
        9px 0 #9caf88,
        4.5px -4px #9caf88,
        4.5px 4px #9caf88;
}

/* Batang kecil */
.clover::after {
    width: 2px;
    height: 7px;
    background: #71855f;
    border-radius: 2px;
    left: 8px;
    top: 13px;
}

/* Variasi strawberry */
.strawberry::before {
    background: #d98b8b;
    width: 13px;
    height: 15px;
    left: 2px;
    top: 3px;
    border-radius: 45% 45% 50% 50%;
    box-shadow: none;
}

.strawberry::after {
    width: 10px;
    height: 5px;
    background: #78945f;
    left: 4px;
    top: 0;
    border-radius: 50%;
}

/* Animasi */
@keyframes float {
    0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 0.55;
    }

    85% {
        opacity: 0.55;
    }

    100% {
        transform: translateY(-120px) rotate(360deg);
        opacity: 0;
    }
}

/* ================= FOOTER ================= */

footer {
    background: white;
    text-align: center;
    padding: 35px 20px;
    color: #888;
    font-size: 12px;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 10;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    header {
        height: 65px;
    }

    nav {
        gap: 25px;
    }

    nav a {
        font-size: 12px;
    }

    .gallery-header {
        padding-top: 50px;
    }

    .gallery-header h1 {
        font-size: 30px;
    }

    .category-nav a {
        padding: 0 10px;
        font-size: 11px;
    }

    .category {
        width: 92%;
    }

    .artwork-info {
        padding: 55px 18px 18px;
    }

    .artwork-info small {
        font-size: 9px;
    }

    .artwork-info h2 {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<!-- DECORATION -->
<div id="clover-container"></div>

<!-- HEADER -->
<header>
    <nav>
        <a href="index.html">HOME</a>
        <a href="gallery.html">GALLERY</a>
        <a href="about.html">ABOUT</a>
    </nav>
</header>

<!-- GALLERY HEADER -->
<section class="gallery-header">
    <h1>My Gallery</h1>
    <p>A collection of my artworks.</p>
</section>

<!-- CATEGORY NAV -->
<div class="category-nav">
    <a href="#bw">B&W / PENCIL</a>
    <span>|</span>
    <a href="#painting">PAINTING</a>
    <span>|</span>
    <a href="#digital">DIGITAL ART</a>
</div>

<!-- ================= B&W / PENCIL ================= -->

<section class="category" id="bw">

    <div class="category-title">
        <h2>B&W / Pencil</h2>
    </div>

    <div class="artwork">

        <img src="foto1.jpeg" alt="Portrait Study">

        <div class="artwork-info">
            <small>B&W / PENCIL</small>
            <h2>Portrait Study</h2>
        </div>

    </div>

</section>

<!-- ================= PAINTING ================= -->

<section class="category" id="painting">

    <div class="category-title">
        <h2>Painting</h2>
    </div>

    <div class="artwork">

        <img
            src="Picsart_26-10-06_17-27-05-079_image_repair_1791282548302.jpg"
            alt="My Painting"
        >

        <div class="artwork-info">
            <small>PAINTING</small>
            <h2>My Painting</h2>
        </div>

    </div>

</section>

<!-- ================= DIGITAL ART ================= -->

<section class="category" id="digital">

    <div class="category-title">
        <h2>Digital Art</h2>
    </div>

    <div class="artwork">

        <img src="Tak berjudul22 (2).jpg" alt="Untitled">

        <div class="artwork-info">
            <small>DIGITAL ART</small>
            <h2>Untitled</h2>
        </div>

    </div>

</section>

<!-- FOOTER -->

<footer>
    © 2026 0urnss — All artworks are my own.
</footer>

<script>

/* ================= FLOATING DECORATION ================= */

const container = document.getElementById("clover-container");

function createDecoration() {

    const item = document.createElement("div");

    /* Acak antara daun dan strawberry */
    if (Math.random() > 0.5) {
        item.classList.add("clover");
    } else {
        item.classList.add("clover", "strawberry");
    }

    const fromLeft = Math.random() > 0.5;

    item.style.left = fromLeft
        ? Math.random() * 20 + "%"
        : 80 + Math.random() * 20 + "%";

    item.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    container.appendChild(item);

    setTimeout(() => {
        item.remove();
    }, 10000);
}

setInterval(createDecoration, 1200);

</script>

</body>
</html>
