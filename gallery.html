<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery — 0urnss</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f5eeee;
        color: #333;
        overflow-x: hidden;
    }

    /* =========================
       FLOATING CLOVER & STRAWBERRY
    ========================== */

    #floating-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 10;
    }

    .floating {
        position: absolute;
        font-size: 90px;
        opacity: 0.35;
        user-select: none;
        animation: floatAcross linear forwards;
        filter: saturate(0.9);
    }

    .floating.strawberry {
        font-size: 80px;
    }

    @keyframes floatAcross {
        0% {
            transform: translate(0, 0) rotate(0deg);
        }

        25% {
            transform: translate(70px, -40px) rotate(12deg);
        }

        50% {
            transform: translate(140px, 20px) rotate(-10deg);
        }

        75% {
            transform: translate(210px, -35px) rotate(14deg);
        }

        100% {
            transform: translate(300px, 20px) rotate(-8deg);
        }
    }

    /* =========================
       NAVBAR
    ========================== */

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: white;
        border-bottom: 1px solid #eee;
        animation: fadeDown 0.8s ease;
    }

    nav {
        max-width: 1100px;
        margin: auto;
        height: 75px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 55px;
    }

    nav a {
        text-decoration: none;
        color: #333;
        font-size: 14px;
        letter-spacing: 1px;
        transition: 0.3s ease;
    }

    nav a:hover {
        color: #b98d91;
    }

    /* =========================
       HEADER GALLERY
    ========================== */

    .gallery-header {
        text-align: center;
        padding: 80px 20px 35px;
        position: relative;
        z-index: 20;
        animation: fadeUp 0.9s ease;
    }

    .gallery-header h1 {
        font-size: 42px;
        font-weight: 400;
        letter-spacing: 3px;
        margin-bottom: 15px;
    }

    .gallery-header p {
        font-size: 14px;
        color: #777;
        letter-spacing: 1px;
    }

    /* =========================
       CATEGORY NAV
    ========================== */

    .category-nav {
        position: relative;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px auto 70px;
        width: fit-content;
        background: rgba(245, 238, 238, 0.8);
    }

    .category-nav a {
        color: #555;
        text-decoration: none;
        font-size: 13px;
        letter-spacing: 1px;
        padding: 0 28px;
        transition: 0.3s ease;
    }

    .category-nav a:not(:last-child) {
        border-right: 1px solid #bdb0b0;
    }

    .category-nav a:hover {
        color: #a7787e;
    }

    /* =========================
       SECTION
    ========================== */

    .category {
        max-width: 900px;
        margin: 0 auto 120px;
        padding: 0 25px;

        position: relative;
        z-index: 20;

        opacity: 0;
        transform: translateY(45px);
        transition: opacity 1s ease, transform 1s ease;
    }

    .category.show {
        opacity: 1;
        transform: translateY(0);
    }

    .category h2 {
        text-align: center;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: 2px;
        margin-bottom: 35px;
    }

    /* =========================
       ARTWORK
    ========================== */

    .artwork {
        position: relative;
        z-index: 30;

        width: 100%;
        margin: 0 auto 55px;

        background: #eee;
        border-radius: 22px;
        overflow: hidden;

        box-shadow: 0 15px 40px rgba(80, 60, 60, 0.08);

        transition:
            transform 0.5s ease,
            box-shadow 0.5s ease;
    }

    .artwork:hover {
        transform: translateY(-6px);
        box-shadow: 0 22px 50px rgba(80, 60, 60, 0.14);
    }

    .artwork img {
        display: block;
        width: 100%;
        height: auto;

        border-radius: 22px;

        transition:
            transform 0.7s ease,
            filter 0.5s ease;
    }

    .artwork:hover img {
        transform: scale(1.025);
        filter: brightness(0.78);
    }

    /* =========================
       ARTWORK TEXT
    ========================== */

    .artwork-info {
        position: absolute;
        inset: 0;

        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;

        padding: 40px;

        background: linear-gradient(
            to top,
            rgba(0,0,0,0.5),
            transparent 55%
        );

        color: white;

        opacity: 0;
        transition: opacity 0.5s ease;
    }

    .artwork:hover .artwork-info {
        opacity: 1;
    }

    .artwork-info span {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 8px;
    }

    .artwork-info h3 {
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 1px;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
        position: relative;
        z-index: 20;

        background: white;
        text-align: center;
        padding: 35px 20px;

        font-size: 12px;
        color: #888;
        letter-spacing: 1px;
    }

    /* =========================
       ANIMATION
    ========================== */

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(25px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeDown {
        from {
            opacity: 0;
            transform: translateY(-20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

        nav {
            height: 65px;
            gap: 25px;
        }

        nav a {
            font-size: 12px;
        }

        .gallery-header {
            padding: 60px 20px 30px;
        }

        .gallery-header h1 {
            font-size: 32px;
        }

        .category-nav {
            margin-bottom: 55px;
        }

        .category-nav a {
            font-size: 10px;
            padding: 0 14px;
        }

        .category {
            padding: 0 15px;
            margin-bottom: 85px;
        }

        .category h2 {
            font-size: 19px;
        }

        .artwork {
            border-radius: 18px;
            margin-bottom: 40px;
        }

        .artwork img {
            border-radius: 18px;
        }

        .artwork-info {
            padding: 25px;
        }

        .artwork-info h3 {
            font-size: 19px;
        }

        .floating {
            font-size: 65px;
            opacity: 0.3;
        }

        .floating.strawberry {
            font-size: 58px;
        }
    }
</style>
</head>

<body>

<!-- =========================
     FLOATING DECORATIONS
========================== -->

<div id="floating-container"></div>


<!-- =========================
     NAVBAR
========================== -->

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="about.html">About</a>
    </nav>
</header>


<!-- =========================
     GALLERY HEADER
========================== -->

<section class="gallery-header">

    <h1>My Gallery</h1>

    <p>
        a little collection of things i've created
    </p>

</section>


<!-- =========================
     CATEGORY NAV
========================== -->

<div class="category-nav">

    <a href="#bw">B&amp;W / Pencil</a>

    <a href="#painting">Painting</a>

    <a href="#digital">Digital Art</a>

</div>


<!-- =========================
     B&W / PENCIL
========================== -->

<section class="category" id="bw">

    <h2>B&amp;W / Pencil</h2>

    <div class="artwork">

        <img
            src="foto1.jpeg"
            alt="Portrait Study"
        >

        <div class="artwork-info">

            <span>B&amp;W / Pencil</span>

            <h3>Portrait Study</h3>

        </div>

    </div>

</section>


<!-- =========================
     PAINTING
========================== -->

<section class="category" id="painting">

    <h2>Painting</h2>

    <div class="artwork">

        <img
            src="Picsart_26-10-06_17-27-05-079_image_repair_1791282548302.jpg"
            alt="My Painting"
        >

        <div class="artwork-info">

            <span>Painting</span>

            <h3>My Painting</h3>

        </div>

    </div>

</section>


<!-- =========================
     DIGITAL ART
========================== -->

<section class="category" id="digital">

    <h2>Digital Art</h2>

    <div class="artwork">

        <img
            src="Tak berjudul22 (2).jpg"
            alt="Untitled Digital Art"
        >

        <div class="artwork-info">

            <span>Digital Art</span>

            <h3>Untitled</h3>

        </div>

    </div>

</section>


<!-- =========================
     FOOTER
========================== -->

<footer>

    © 2026 0urnss — made with love &amp; art

</footer>


<script>

/* =====================================
   SCROLL REVEAL
===================================== */

const sections = document.querySelectorAll(".category");

const observer = new IntersectionObserver(
    (entries) => {

        entries.forEach((entry) => {

            if (entry.isIntersecting) {

                entry.target.classList.add("show");

            }

        });

    },
    {
        threshold: 0.12
    }
);

sections.forEach((section) => {

    observer.observe(section);

});


/* =====================================
   FLOATING CLOVER + STRAWBERRY
===================================== */

const floatingContainer =
    document.getElementById("floating-container");

const decorations = ["🍀", "🍓"];


function createFloating() {

    const item =
        document.createElement("div");

    item.classList.add("floating");

    const decoration =
        decorations[
            Math.floor(
                Math.random() * decorations.length
            )
        ];

    item.textContent = decoration;


    /* Strawberry sedikit lebih kecil */

    if (decoration === "🍓") {

        item.classList.add("strawberry");

    }


    /* Ukuran random */

    const size =
        decoration === "🍓"
            ? 65 + Math.random() * 35
            : 75 + Math.random() * 35;

    item.style.fontSize = size + "px";


    /* Mulai dari kiri atau kanan */

    const fromLeft =
        Math.random() > 0.5;


    if (fromLeft) {

        item.style.left =
            (-size) + "px";

    } else {

        item.style.left =
            (window.innerWidth + size) + "px";

    }


    /* Posisi vertikal random */

    const top =
        10 + Math.random() * 80;

    item.style.top =
        top + "vh";


    /* Arah gerakan */

    if (!fromLeft) {

        item.style.transform =
            "scaleX(-1)";

    }


    /* Kecepatan random */

    const duration =
        9 + Math.random() * 7;

    item.style.animationDuration =
        duration + "s";


    /* Opacity random */

    item.style.opacity =
        0.22 + Math.random() * 0.18;


    floatingContainer.appendChild(item);


    /* Hapus setelah selesai */

    setTimeout(() => {

        item.remove();

    }, (duration + 1) * 1000);

}


/* =====================================
   MUNCUL TERUS-MENERUS
===================================== */

/* Beberapa muncul ketika halaman pertama dibuka */

for (let i = 0; i < 3; i++) {

    setTimeout(() => {

        createFloating();

    }, i * 1200);

}


/* Kemudian muncul terus */

setInterval(() => {

    createFloating();

}, 3000);


/* Tambahan kecil supaya saat scroll
   tetap terasa hidup */

window.addEventListener("scroll", () => {

    if (Math.random() > 0.75) {

        createFloating();

    }

});

</script>

</body>
</html>
