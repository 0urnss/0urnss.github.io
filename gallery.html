<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Art Gallery</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#f7e8ec;
    color:#59484d;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
    background:
        radial-gradient(circle at 10% 20%,rgba(255,255,255,.65),transparent 25%),
        radial-gradient(circle at 90% 80%,rgba(255,255,255,.5),transparent 25%);
}

/* DECOR */
.decor{
    position:fixed;
    pointer-events:none;
    z-index:-1;
    opacity:.45;
    animation:float 6s ease-in-out infinite;
}

.decor.one{
    top:18%;
    left:5%;
    font-size:28px;
}

.decor.two{
    top:55%;
    right:5%;
    font-size:25px;
    animation-delay:1.5s;
}

.decor.three{
    bottom:10%;
    left:8%;
    font-size:22px;
    animation-delay:3s;
}

.decor.four{
    top:8%;
    right:10%;
    font-size:20px;
    animation-delay:2s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-12px) rotate(5deg);
    }
}


/* TOP BOARD */
.top-area{
    padding:28px 20px 0;
}

.main-board{
    max-width:1050px;
    margin:auto;
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:0 8px 0 rgba(169,118,130,.35);
}

.board-inner{
    position:relative;
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:22px 20px 18px;
    overflow:hidden;
}

.board-inner::before{
    content:"✿";
    position:absolute;
    top:12px;
    left:18px;
    font-size:25px;
    color:#b47786;
    transform:rotate(-15deg);
}

.board-inner::after{
    content:"♡";
    position:absolute;
    top:13px;
    right:20px;
    font-size:26px;
    color:#b47786;
    transform:rotate(10deg);
}


/* LOGO */
.logo{
    text-align:center;
    font-family:Georgia,serif;
    font-size:38px;
    color:#805965;
    letter-spacing:1px;
    margin-bottom:18px;
    cursor:default;
}


/* NAVBAR */
.navbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:#805965;
    background:#f8edf0;
    border:2px solid #c28f9b;
    border-radius:13px;
    padding:9px 17px;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 4px 0 #c28f9b;
    transition:.2s;
}

.navbar a:hover{
    background:#edc4ce;
    transform:translateY(-2px);
    box-shadow:0 6px 0 #c28f9b;
}

.navbar a.active{
    background:#e9bdc8;
}


/* GALLERY */
.gallery-wrap{
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.gallery-board{
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:0 8px 0 rgba(169,118,130,.35);
}

.gallery-inner{
    background:#fff8f9;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:32px 25px 35px;
    position:relative;
}

.gallery-title{
    text-align:center;
    margin-bottom:8px;
    font-family:Georgia,serif;
    color:#805965;
    font-size:32px;
}

.gallery-subtitle{
    text-align:center;
    color:#9b737d;
    font-size:14px;
    margin-bottom:25px;
}


/* CATEGORY */
.category-nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:30px;
}

.category-btn{
    border:2px solid #c28f9b;
    background:#f8edf0;
    color:#805965;
    border-radius:13px;
    padding:9px 16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 4px 0 #c28f9b;
    transition:.2s;
}

.category-btn:hover{
    background:#edc4ce;
    transform:translateY(-2px);
}

.category-btn.active{
    background:#e7b8c4;
}


/* CATEGORY CONTENT */
.category-content{
    display:none;
}

.category-content.active{
    display:block;
}


/* ARTWORK */
.art-card{
    background:#fff;
    border:2px solid #ead2d8;
    border-radius:22px;
    padding:12px;
    margin-bottom:30px;
    box-shadow:0 7px 18px rgba(128,89,101,.12);
    transition:.3s;
}

.art-card:hover{
    transform:translateY(-3px);
}

.art-image-wrap{
    position:relative;
    overflow:hidden;
    border-radius:16px;
    background:#f4e9ec;
}

.art-image{
    width:100%;
    display:block;
    border-radius:16px;
    transition:.4s;
}

.art-image-wrap:hover .art-image{
    transform:scale(1.025);
}

.art-title{
    text-align:center;
    font-family:Georgia,serif;
    font-size:22px;
    color:#805965;
    margin-top:17px;
}

.art-description{
    text-align:center;
    font-size:13px;
    color:#9b737d;
    margin-top:5px;
}


/* RATING */
.rating-box{
    margin:18px auto 8px;
    padding:15px;
    max-width:500px;
    background:#fdf4f6;
    border:1px solid #ead2d8;
    border-radius:16px;
    text-align:center;
}

.rating-title{
    font-size:13px;
    color:#805965;
    font-weight:bold;
    margin-bottom:7px;
}

.stars{
    display:flex;
    justify-content:center;
    gap:5px;
    margin:5px 0 8px;
}

.star{
    border:0;
    background:none;
    padding:0 2px;
    font-size:31px;
    line-height:1;
    cursor:pointer;
    color:#d7c4c8;
    transition:.15s;
}

.star:hover{
    transform:scale(1.15);
}

.star.selected,
.star.hovered{
    color:#e3a4b3;
}

.rating-result{
    font-size:12px;
    color:#9b737d;
    min-height:18px;
}

.rating-message{
    font-size:12px;
    color:#805965;
    margin-top:7px;
    min-height:18px;
}


/* LOADING */
.loading{
    text-align:center;
    padding:40px 15px;
    color:#9b737d;
    font-size:14px;
}

.empty-gallery{
    text-align:center;
    padding:40px 15px;
    color:#9b737d;
    font-size:14px;
}

.error-gallery{
    text-align:center;
    padding:30px 15px;
    color:#a55f6e;
    font-size:14px;
}


/* FLOATING DECOR */
#clover-container{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:-1;
}

.floating-item{
    position:absolute;
    font-size:22px;
    opacity:.25;
    animation:fall linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-50px) rotate(0deg);
    }

    to{
        transform:translateY(110vh) rotate(360deg);
    }
}


/* FOOTER */
footer{
    text-align:center;
    padding:25px 20px 35px;
    color:#9b737d;
    font-size:12px;
}


/* MOBILE */
@media(max-width:600px){

    .top-area{
        padding:18px 12px 0;
    }

    .main-board{
        border-radius:23px;
        padding:9px;
    }

    .board-inner{
        border-radius:17px;
        padding:18px 12px 15px;
    }

    .logo{
        font-size:29px;
        margin-bottom:15px;
    }

    .navbar{
        gap:7px;
    }

    .navbar a{
        font-size:12px;
        padding:8px 11px;
    }

    .gallery-wrap{
        margin:30px auto;
        padding:0 12px;
    }

    .gallery-board{
        border-radius:23px;
        padding:9px;
    }

    .gallery-inner{
        border-radius:17px;
        padding:25px 13px 28px;
    }

    .gallery-title{
        font-size:27px;
    }

    .gallery-subtitle{
        font-size:12px;
    }

    .category-btn{
        font-size:12px;
        padding:8px 11px;
    }

    .art-title{
        font-size:19px;
    }

    .star{
        font-size:28px;
    }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
    "https://ojjpssupaoputowjvokm.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_dFkIBbLpaQm2H8VrkyQqLw_TTsrC_fy";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================================
   GLOBAL DATA
   ===================================================== */

let artworks = [];


/* =====================================================
   SECRET ADMIN LOGIN
   Klik ART GALLERY 5x dengan cepat
   ===================================================== */

let logoClicks = 0;
let logoTimer;

document
    .getElementById("secretLogo")
    .addEventListener(
        "click",
        function(){

            logoClicks++;

            clearTimeout(
                logoTimer
            );

            logoTimer =
                setTimeout(
                    function(){

                        logoClicks = 0;

                    },
                    1500
                );


            if(
                logoClicks >= 5
            ){

                logoClicks = 0;

                window.location.href =
                    "admin.html";

            }

        }
    );


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   FORMAT CATEGORY
   ===================================================== */

function categoryIcon(category){

    const text =
        String(category)
            .toLowerCase();


    if(
        text.includes("pencil") ||
        text.includes("b&w") ||
        text.includes("black") ||
        text.includes("drawing")
    ){

        return "✏️";

    }


    if(
        text.includes("paint") ||
        text.includes("acrylic")
    ){

        return "🎨";

    }


    if(
        text.includes("digital")
    ){

        return "🖥️";

    }


    return "🖼️";

}


/* =====================================================
   LOAD ARTWORKS
   ===================================================== */

async function loadArtworks(){

    const galleryContent =
        document.getElementById(
            "galleryContent"
        );

    const categoryNav =
        document.getElementById(
            "categoryNav"
        );


    galleryContent.innerHTML =
        '<div class="loading">' +
        'Memuat karya...' +
        '</div>';


    categoryNav.innerHTML =
        '<div class="loading">' +
        'Memuat kategori...' +
        '</div>';


    try{

        const response =
            await supabaseClient
                .from("artworks")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(
            response.error
        ){

            console.error(
                response.error
            );


            galleryContent.innerHTML =
                '<div class="error-gallery">' +
                'Gagal memuat karya dari database.' +
                '</div>';


            categoryNav.innerHTML =
                "";


            return;

        }


        artworks =
            response.data || [];


        if(
            artworks.length === 0
        ){

            categoryNav.innerHTML =
                "";


            galleryContent.innerHTML =
                '<div class="empty-gallery">' +
                'Belum ada karya di gallery ♡' +
                '</div>';


            return;

        }


        renderCategories();

    }

    catch(error){

        console.error(
            error
        );


        categoryNav.innerHTML =
            "";


        galleryContent.innerHTML =
            '<div class="error-gallery">' +
            'Terjadi kesalahan saat memuat gallery.' +
            '</div>';

    }

}


/* =====================================================
   RENDER CATEGORY BUTTONS
   ===================================================== */

function renderCategories(){

    const categoryNav =
        document.getElementById(
            "categoryNav"
        );


    const categories = [];


    artworks.forEach(
        artwork => {

            const category =
                artwork.category ||
                "Other";


            if(
                !categories.includes(
                    category
                )
            ){

                categories.push(
                    category
                );

            }

        }
    );


    categoryNav.innerHTML =
        "";


    categories.forEach(
        (
            category,
            index
        ) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "category-btn";


            if(
                index === 0
            ){

                button.classList.add(
                    "active"
                );

            }


            button.innerHTML =
                categoryIcon(
                    category
                ) +
                " " +
                escapeHTML(
                    category
                );


            button.addEventListener(
                "click",
                function(){

                    showCategory(
                        category,
                        button
                    );

                }
            );


            categoryNav.appendChild(
                button
            );

        }
    );


    renderArtworkCategories(
        categories[0]
    );

}


/* =====================================================
   SHOW CATEGORY
   ===================================================== */

function showCategory(
    category,
    button
){

    document
        .querySelectorAll(
            ".category-content"
        )
        .forEach(
            section => {

                section.classList.remove(
                    "active"
                );

            }
        );


    const selected =
        document.querySelector(
            '[data-category="' +
            CSS.escape(
                category
            ) +
            '"]'
        );


    if(
        selected
    ){

        selected.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".category-btn"
        )
        .forEach(
            btn => {

                btn.classList.remove(
                    "active"
                );

            }
        );


    button.classList.add(
        "active"
    );

}


/* =====================================================
   RENDER ARTWORKS
   ===================================================== */

function renderArtworkCategories(
    firstCategory
){

    const galleryContent =
        document.getElementById(
            "galleryContent"
        );


    galleryContent.innerHTML =
        "";


    const categories = [];


    artworks.forEach(
        artwork => {

            const category =
                artwork.category ||
                "Other";


            if(
                !categories.includes(
                    category
                )
            ){

                categories.push(
                    category
                );

            }

        }
    );


    categories.forEach(
        category => {

            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "category-content";


            section.dataset.category =
                category;


            if(
                category === firstCategory
            ){

                section.classList.add(
                    "active"
                );

            }


            const categoryArtworks =
                artworks.filter(
                    artwork =>
                        (
                            artwork.category ||
                            "Other"
                        ) === category
                );


            categoryArtworks.forEach(
                artwork => {

                    section.appendChild(
                        createArtworkCard(
                            artwork
                        )
                    );

                }
            );


            galleryContent.appendChild(
                section
            );

        }
    );

}


/* =====================================================
   CREATE ARTWORK CARD
   ===================================================== */

function createArtworkCard(
    artwork
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "art-card";


    const artworkId =
        "artwork-" +
        artwork.id;


    card.innerHTML = `

        <div class="art-image-wrap">

            <img
                src="${escapeHTML(
                    artwork.image_url
                )}"
                alt="${escapeHTML(
                    artwork.title
                )}"
                class="art-image"
                loading="lazy">

        </div>


        <h2 class="art-title">
            ${escapeHTML(
                artwork.title
            )}
        </h2>


        <p class="art-description">
            ${escapeHTML(
                artwork.description ||
                artwork.category ||
                ""
            )}
        </p>


        <div
            class="rating-box"
            data-artwork="${escapeHTML(
                artworkId
            )}">

            <div class="rating-title">
                ⭐ Rate this artwork
            </div>

            <div class="stars">

                <button
                    class="star"
                    data-rating="1">
                    ★
                </button>

                <button
                    class="star"
                    data-rating="2">
                    ★
                </button>

                <button
                    class="star"
                    data-rating="3">
                    ★
                </button>

                <button
                    class="star"
                    data-rating="4">
                    ★
                </button>

                <button
                    class="star"
                    data-rating="5">
                    ★
                </button>

            </div>

            <div class="rating-result">
                Memuat rating...
            </div>

            <div class="rating-message"></div>

        </div>

    `;


    setupRating(
        card.querySelector(
            ".rating-box"
        )
    );


    return card;

}


/* =====================================================
   SETUP RATING
   ===================================================== */

function setupRating(
    box
){

    const artwork =
        box.dataset.artwork;


    const stars =
        box.querySelectorAll(
            ".star"
        );


    const result =
        box.querySelector(
            ".rating-result"
        );


    const message =
        box.querySelector(
            ".rating-message"
        );


    loadRating(
        artwork,
        result
    );


    stars.forEach(
        star => {

            star.addEventListener(
                "mouseenter",
                function(){

                    const value =
                        Number(
                            this.dataset.rating
                        );


                    stars.forEach(
                        s => {

                            const starValue =
                                Number(
                                    s.dataset.rating
                                );


                            s.classList.toggle(
                                "hovered",
                                starValue <= value
                            );

                        }
                    );

                }
            );


            star.addEventListener(
                "click",
                async function(){

                    const value =
                        Number(
                            this.dataset.rating
                        );


                    await submitRating(
                        artwork,
                        value,
                        stars,
                        result,
                        message
                    );

                }
            );

        }
    );


    box.addEventListener(
        "mouseleave",
        function(){

            stars.forEach(
                star => {

                    star.classList.remove(
                        "hovered"
                    );

                }
            );

        }
    );

}


/* =====================================================
   LOAD RATING
   ===================================================== */

async function loadRating(
    artwork,
    result
){

    try{

        const response =
            await supabaseClient
                .from("ratings")
                .select("rating")
                .eq(
                    "artwork",
                    artwork
                );


        if(
            response.error
        ){

            console.error(
                response.error
            );


            result.textContent =
                "Rating belum tersedia";


            return;

        }


        const data =
            response.data;


        if(
            !data ||
            data.length === 0
        ){

            result.textContent =
                "Belum ada rating";


            return;

        }


        let total = 0;


        data.forEach(
            item => {

                total +=
                    Number(
                        item.rating
                    );

            }
        );


        const average =
            total /
            data.length;


        result.textContent =
            "⭐ " +
            average.toFixed(1) +
            " / 5 · " +
            data.length +
            " rating";

    }

    catch(error){

        console.error(
            error
        );


        result.textContent =
            "Rating belum tersedia";

    }

}


/* =====================================================
   SUBMIT RATING
   ===================================================== */

async function submitRating(
    artwork,
    value,
    stars,
    result,
    message
){

    const storageKey =
        "rated_" +
        artwork;


    if(
        localStorage.getItem(
            storageKey
        )
    ){

        message.textContent =
            "Kamu sudah memberi rating untuk karya ini ♡";


        return;

    }


    stars.forEach(
        star => {

            const starValue =
                Number(
                    star.dataset.rating
                );


            star.classList.toggle(
                "selected",
                starValue <= value
            );

        }
    );


    message.textContent =
        "Menyimpan rating...";


    try{

        const response =
            await supabaseClient
                .from("ratings")
                .insert([
                    {
                        artwork:artwork,
                        rating:value
                    }
                ]);


        if(
            response.error
        ){

            console.error(
                response.error
            );


            message.textContent =
                "Rating gagal disimpan.";


            return;

        }


        localStorage.setItem(
            storageKey,
            value
        );


        message.textContent =
            "Rating kamu berhasil disimpan ♡";


        await loadRating(
            artwork,
            result
        );

    }

    catch(error){

        console.error(
            error
        );


        message.textContent =
            "Terjadi kesalahan.";

    }

}


/* =====================================================

loadArtworks();

</script>
