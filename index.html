<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Art Gallery</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            color: #333;
            background: #fff;
        }

        /* NAVBAR */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            background: white;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-family: Georgia, serif;
            font-size: 20px;
            letter-spacing: 2px;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #555;
            font-size: 13px;
            transition: .2s;
        }

        nav a:hover {
            color: #b97986;
        }

        /* HOME */

        .home {
            min-height: calc(100vh - 75px);
            background: #f5eeee;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 70px 8%;
        }

        .home-content {
            width: 100%;
            max-width: 1100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 70px;
        }

        .home-text {
            max-width: 500px;
        }

        .tag {
            font-size: 10px;
            letter-spacing: 3px;
            color: #b97986;
            margin-bottom: 22px;
        }

        .home h1 {
            font-family: Georgia, serif;
            font-size: 58px;
            font-weight: 400;
            line-height: 1.1;
            margin-bottom: 22px;
        }

        .home p {
            color: #777;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 30px;
            max-width: 430px;
        }

        .gallery-button {
            display: inline-block;
            padding: 14px 24px;
            background: #b97986;
            color: white;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 1.5px;
            border-radius: 3px;
            transition: .2s;
        }

        .gallery-button:hover {
            background: #a76674;
        }

        .home-image {
            width: 390px;
            height: 480px;
            overflow: hidden;
            border-radius: 5px;
        }

        .home-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px;
            background: #fff;
            color: #999;
            font-size: 11px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 0 20px;
            }

            nav {
                gap: 15px;
            }

            nav a {
                font-size: 11px;
            }

            .home {
                min-height: auto;
                padding: 60px 25px 70px;
            }

            .home-content {
                flex-direction: column;
                text-align: center;
                gap: 45px;
            }

            .home h1 {
                font-size: 43px;
            }

            .home p {
                margin-left: auto;
                margin-right: auto;
            }

            .home-image {
                width: 100%;
                max-width: 350px;
                height: 420px;
            }
        }

        @media (max-width: 400px) {

            .logo {
                font-size: 16px;
            }

            nav {
                gap: 10px;
            }

            nav a {
                font-size: 10px;
            }

            .home h1 {
                font-size: 37px;
            }
        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        ART GALLERY
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="gallery.html">
            Gallery
        </a>

        <a href="about.html">
            About
        </a>

    </nav>

</header>



<section class="home">

    <div class="home-content">


        <div class="home-text">

            <div class="tag">
                MY PERSONAL COLLECTION
            </div>

            <h1>
                A Little Space
                <br>
                for My Art
            </h1>

            <p>
                Welcome to my little art gallery.
                A collection of drawings, paintings,
                digital art, and other creative works
                that I've made.
            </p>

            <a
                href="gallery.html"
                class="gallery-button"
            >
                VIEW MY GALLERY
            </a>

        </div>



        <div class="home-image">

            <img
                src="download.jfif"
                alt="Art supplies"
            >

        </div>


    </div>

</section>



<footer>

    © 2026 ART GALLERY · Personal artwork archive

</footer>


</body>

</html>
