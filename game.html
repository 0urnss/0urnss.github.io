<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Games — Art Gallery</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,sans-serif;
    background:#f7e8ec;
    color:#59484d;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
    background:
        radial-gradient(circle at 10% 20%,rgba(255,255,255,.65),transparent 25%),
        radial-gradient(circle at 90% 80%,rgba(255,255,255,.5),transparent 25%);
}

.decor{
    position:fixed;
    pointer-events:none;
    z-index:-1;
    opacity:.45;
    animation:float 6s ease-in-out infinite;
}

.decor.one{
    top:18%;
    left:5%;
    font-size:28px;
}

.decor.two{
    top:55%;
    right:5%;
    font-size:25px;
    animation-delay:1.5s;
}

.decor.three{
    bottom:10%;
    left:8%;
    font-size:22px;
    animation-delay:3s;
}

.decor.four{
    top:8%;
    right:10%;
    font-size:20px;
    animation-delay:2s;
}

@keyframes float{

    0%,100%{
        transform:translateY(0) rotate(0deg);
    }

    50%{
        transform:translateY(-12px) rotate(5deg);
    }

}

.top-area{
    padding:28px 20px 0;
}

.main-board{
    max-width:1050px;
    width:100%;
    margin:auto;
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:
        0 8px 0 rgba(169,118,130,.35);
}

.board-inner{
    position:relative;
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:22px 20px 18px;
    overflow:hidden;
}

.board-inner::before{
    content:"✿";
    position:absolute;
    top:12px;
    left:18px;
    font-size:25px;
    color:#b47786;
    transform:rotate(-15deg);
}

.board-inner::after{
    content:"♡";
    position:absolute;
    top:13px;
    right:20px;
    font-size:26px;
    color:#b47786;
    transform:rotate(10deg);
}

.logo{
    text-align:center;
    font-family:Georgia,serif;
    font-size:38px;
    color:#805965;
    letter-spacing:1px;
    margin-bottom:18px;
}

.navbar{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.navbar a{
    text-decoration:none;
    color:#805965;
    background:#f8edf0;
    border:2px solid #c28f9b;
    border-radius:13px;
    padding:9px 17px;
    font-size:14px;
    font-weight:bold;
    box-shadow:
        0 4px 0 #c28f9b;
    transition:.2s;
}

.navbar a:hover{
    background:#edc4ce;
    transform:translateY(-2px);
    box-shadow:
        0 6px 0 #c28f9b;
}

.navbar a.active{
    background:#e9bdc8;
}

.page{
    width:100%;
    max-width:900px;
    margin:40px auto;
    padding:0 20px;
}

.game-board{
    width:100%;
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:
        0 8px 0 rgba(169,118,130,.35);
}

.game-inner{
    position:relative;
    width:100%;
    background:#fff8f9;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:32px 25px 35px;
    overflow:hidden;
}

.game-inner::before{
    content:"♡";
    position:absolute;
    left:20px;
    top:15px;
    font-size:22px;
    color:#c28c99;
    opacity:.6;
}

.game-inner::after{
    content:"✦";
    position:absolute;
    right:22px;
    bottom:20px;
    font-size:22px;
    color:#c28c99;
    opacity:.6;
}

.page-title{
    text-align:center;
    margin:0 0 8px;
    font-family:Georgia,serif;
    color:#805965;
    font-size:32px;
}

.page-subtitle{
    text-align:center;
    margin:0 0 18px;
    color:#9b737d;
    font-size:14px;
}

.sound-control{
    text-align:center;
    margin-bottom:20px;
}

.sound-btn{
    border:2px solid #c28f9b;
    background:#f8edf0;
    color:#805965;
    border-radius:13px;
    padding:8px 15px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 4px 0 #c28f9b;
    transition:.2s;
}

.sound-btn:hover{
    background:#edc4ce;
    transform:translateY(-2px);
}

/* =========================
   GAME SELECTOR
========================= */

.game-tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:28px;
    padding:18px 14px 16px;
    background:#f6dce2;
    border:2px dashed #c28c99;
    border-radius:18px;
    position:relative;
}

.game-tabs::before{
    content:"CHOOSE YOUR GAME";
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    background:#fff8f9;
    border:2px solid #c28c99;
    border-radius:12px;
    padding:4px 12px;
    color:#805965;
    font-size:11px;
    font-weight:bold;
    letter-spacing:1px;
}

.game-tab{
    border:2px solid #c28f9b;
    background:#fff8f9;
    color:#805965;
    border-radius:16px;
    padding:12px 18px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    box-shadow:
        0 4px 0 #c28f9b;
    transition:.2s;
    min-width:145px;
}

.game-tab:hover{
    background:#edc4ce;
    transform:translateY(-3px);
    box-shadow:
        0 7px 0 #c28f9b;
}

.game-tab.active{
    background:#d9aeb9;
    color:#fff8f9;
    border-color:#a97682;
    box-shadow:
        0 5px 0 #a97682;
    transform:translateY(-2px);
}

.game-tab.active:hover{
    background:#d9aeb9;
}

.game-section{
    display:none;
    animation:fade .35s ease;
}

.game-section.active{
    display:block;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.game-btn{
    border:2px solid #c28f9b;
    background:#f6dce2;
    color:#805965;
    padding:10px 18px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:
        0 4px 0 #c28f9b;
    transition:.2s;
}

.game-btn:hover{
    transform:translateY(-2px);
    background:#edc4ce;
    box-shadow:
        0 6px 0 #c28f9b;
}

.game-btn:active{
    transform:translateY(2px);
    box-shadow:
        0 2px 0 #c28f9b;
}

.game-heading{
    text-align:center;
    color:#805965;
    font-family:Georgia,serif;
    font-size:25px;
    margin:0 0 7px;
}

.game-description{
    text-align:center;
    font-size:13px;
    color:#9b737d;
    margin-bottom:18px;
}

.memory-info{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.info-box{
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:12px;
    padding:8px 14px;
    font-size:13px;
    font-weight:bold;
    color:#76515c;
}

.memory-grid{
    display:grid;
    grid-template-columns:repeat(6,70px);
    justify-content:center;
    gap:9px;
    max-width:520px;
    margin:auto;
}

.memory-card{
    width:70px;
    height:70px;
    perspective:700px;
    cursor:pointer;
}

.memory-card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:.4s;
}

.memory-card.flipped .memory-card-inner,
.memory-card.matched .memory-card-inner{
    transform:rotateY(180deg);
}

.memory-front,
.memory-back{
    position:absolute;
    inset:0;
    border-radius:14px;
    backface-visibility:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    border:2px solid #c28c99;
}

.memory-front{
    background:#d9aeb9;
    color:#fff8f9;
    font-size:25px;
}

.memory-front::after{
    content:"♡";
}

.memory-back{
    background:#fff;
    transform:rotateY(180deg);
    font-size:28px;
}

.memory-card.matched .memory-back{
    background:#f1d8df;
}

.memory-controls{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.memory-message{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    font-weight:bold;
    color:#805965;
    min-height:20px;
}

.color-target-wrap{
    text-align:center;
}

.target-label{
    font-size:14px;
    color:#76515c;
    font-weight:bold;
}

.target-color{
    width:95px;
    height:95px;
    border-radius:50%;
    margin:12px auto 8px;
    border:5px solid #f6dce2;
    box-shadow:
        0 0 0 2px #c28c99;
}

.color-info{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0 20px;
}

.color-stat{
    background:#f6dce2;
    border:2px solid #c28c99;
    padding:8px 15px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
}

.color-options{
    display:grid;
    grid-template-columns:repeat(3,100px);
    justify-content:center;
    gap:13px;
}

.color-choice{
    width:100px;
    height:75px;
    border-radius:15px;
    border:3px solid #fff;
    outline:2px solid #c28c99;
    cursor:pointer;
    transition:.2s;
}

.color-choice:hover{
    transform:scale(1.06);
}

.color-choice.correct{
    outline:3px solid #7cad83;
}

.color-choice.wrong{
    outline:3px solid #d47777;
}

.color-message{
    text-align:center;
    min-height:25px;
    margin-top:18px;
    font-weight:bold;
    color:#805965;
}

.color-controls{
    text-align:center;
    margin-top:15px;
}

.dino-draw-box{
    text-align:center;
}

.dino-draw-name{
    display:inline-block;
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:13px;
    padding:8px 15px;
    font-weight:bold;
    color:#76515c;
    margin-bottom:14px;
}

.dino-canvas-wrap{
    display:flex;
    justify-content:center;
}

#dinoDrawingCanvas{
    display:block;
    width:min(100%,550px);
    height:280px;
    background:white;
    border:3px solid #c28c99;
    border-radius:18px;
    cursor:crosshair;
    touch-action:none;
}

.dino-tools{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:16px;
}

.dino-tool-label{
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:11px;
    padding:8px 12px;
    font-size:13px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:8px;
}

#dinoBrushSize{
    accent-color:#a97682;
}

.dino-color-picker{
    width:32px;
    height:30px;
    border:none;
    padding:0;
    background:transparent;
    cursor:pointer;
}

.dino-palette-title{
    margin:18px 0 10px;
    font-size:13px;
    color:#76515c;
    font-weight:bold;
}

.dino-palette{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
    max-width:480px;
    margin:auto;
}

.dino-palette-color{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid white;
    outline:2px solid #c28c99;
    cursor:pointer;
    transition:.2s;
}

.dino-palette-color:hover{
    transform:scale(1.12);
}

.dino-palette-color.selected{
    outline:3px solid #805965;
    transform:scale(1.12);
}

.dino-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.dino-game-area{
    display:none;
    margin-top:20px;
}

.dino-game-area.active{
    display:block;
}

.dino-score{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.dino-score-box{
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:12px;
    padding:8px 15px;
    font-size:13px;
    font-weight:bold;
    color:#76515c;
}
