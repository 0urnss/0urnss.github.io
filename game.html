<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Game — Art Gallery</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    background:#f7e8ec;
    color:#59484d;
    min-height:100vh;
    overflow-x:hidden;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(circle at 10% 15%, rgba(255,255,255,.65), transparent 18%),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.5), transparent 20%);
    z-index:-2;
}

/* FLOATING DECORATION */

.decor{
    position:fixed;
    font-size:24px;
    opacity:.45;
    pointer-events:none;
    z-index:0;
    animation:float 5s ease-in-out infinite;
}

.decor1{
    top:18%;
    left:4%;
}

.decor2{
    top:70%;
    right:5%;
    animation-delay:1s;
}

.decor3{
    top:42%;
    right:3%;
    animation-delay:2s;
}

.decor4{
    top:85%;
    left:7%;
    animation-delay:3s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0) rotate(0deg);
    }
    50%{
        transform:translateY(-12px) rotate(8deg);
    }
}

/* TOP AREA */

.top-area{
    padding:28px 20px 0;
}

.main-board{
    max-width:1050px;
    margin:auto;
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:0 8px 0 rgba(169,118,130,.35);
    position:relative;
}

.board-inner{
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:25px 20px 18px;
    position:relative;
    overflow:hidden;
}

.board-inner::before{
    content:"✦";
    position:absolute;
    top:10px;
    left:18px;
    font-size:22px;
    color:#a97682;
    opacity:.7;
}

.board-inner::after{
    content:"♡";
    position:absolute;
    top:8px;
    right:20px;
    font-size:25px;
    color:#a97682;
    opacity:.7;
}

/* LOGO */

.logo{
    text-align:center;
    font-family:Georgia, serif;
    font-size:38px;
    letter-spacing:3px;
    color:#805965;
    margin-bottom:20px;
}

/* NAVIGATION */

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

nav a{
    text-decoration:none;
    color:#684c54;
    background:#f8edf0;
    border:2px solid #c28f9b;
    padding:10px 20px;
    border-radius:13px;
    font-size:14px;
    font-weight:bold;
    box-shadow:0 4px 0 #c28f9b;
    transition:.2s ease;
}

nav a:hover{
    background:#efc6d0;
    transform:translateY(-3px);
    box-shadow:0 7px 0 #b87f8c;
}

nav a.active{
    background:#edc3ce;
}

/* GAME HEADER */

.game-header{
    text-align:center;
    padding:70px 20px 30px;
    position:relative;
    z-index:2;
}

.game-header h1{
    font-family:Georgia, serif;
    font-size:42px;
    color:#805965;
    margin-bottom:10px;
}

.game-header p{
    font-size:15px;
    color:#806b71;
}

/* GAME BOARD */

.game-wrapper{
    max-width:900px;
    margin:0 auto 80px;
    padding:0 20px;
    position:relative;
    z-index:2;
}

.game-card{
    background:#d9aeb9;
    border:2px solid #a97682;
    border-radius:28px;
    padding:12px;
    box-shadow:0 8px 0 rgba(169,118,130,.35);
}

.game-inner{
    background:#fff8f9;
    border:2px solid #c28c99;
    border-radius:21px;
    padding:25px;
    position:relative;
}

/* TAPE */

.tape{
    position:absolute;
    width:90px;
    height:24px;
    background:#f0cdd5;
    opacity:.8;
    top:-10px;
}

.tape.left{
    left:50px;
    transform:rotate(-6deg);
}

.tape.right{
    right:50px;
    transform:rotate(6deg);
}

/* SCORE */

.score-area{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:10px 0 20px;
}

.score-box{
    min-width:120px;
    background:#f6dce2;
    border:2px solid #c28c99;
    border-radius:15px;
    padding:10px 15px;
    text-align:center;
}

.score-box span{
    display:block;
    font-size:12px;
    color:#8a7077;
    margin-bottom:3px;
}

.score-box strong{
    font-size:23px;
    color:#805965;
}

/* GAME AREA */

#gameArea{
    height:430px;
    background:#f9edf0;
    border:2px dashed #c28c99;
    border-radius:20px;
    position:relative;
    overflow:hidden;
}

/* SMALL DECORATIONS INSIDE */

#gameArea::before{
    content:"♡";
    position:absolute;
    top:15px;
    left:20px;
    font-size:22px;
    color:#d4a2ae;
}

#gameArea::after{
    content:"✦";
    position:absolute;
    bottom:15px;
    right:20px;
    font-size:20px;
    color:#d4a2ae;
}

/* STAR */

.star{
    position:absolute;
    width:58px;
    height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    cursor:pointer;
    user-select:none;
    animation:starPop .18s ease;
    filter:drop-shadow(0 4px 3px rgba(128,89,101,.2));
    transition:.15s ease;
}

.star:hover{
    transform:scale(1.18) rotate(10deg);
}

@keyframes starPop{
    from{
        transform:scale(.2);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

/* MESSAGE */

.message{
    text-align:center;
    min-height:28px;
    margin:15px 0 12px;
    font-size:14px;
    color:#806b71;
}

/* BUTTON */

.start-btn{
    display:block;
    margin:0 auto;
    border:none;
    background:#c28c99;
    color:white;
    font-size:15px;
    font-weight:bold;
    padding:12px 30px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 4px 0 #a97682;
    transition:.2s ease;
}

.start-btn:hover{
    background:#b77d8a;
    transform:translateY(-2px);
    box-shadow:0 6px 0 #95626e;
}

.start-btn:active{
    transform:translateY(2px);
    box-shadow:0 2px 0 #95626e;
}

/* INSTRUCTION */

.instruction{
    text-align:center;
    margin-top:20px;
    padding:15px;
    background:#f6dce2;
    border-radius:15px;
    border:1px solid #e0b6c0;
    font-size:13px;
    color:#806b71;
}

.instruction b{
    color:#805965;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px 20px 40px;
    color:#8a7077;
    font-size:13px;
}

/* RESPONSIVE */

@media(max-width:700px){

    .top-area{
        padding:18px 12px 0;
    }

    .main-board{
        border-radius:22px;
    }

    .board-inner{
        padding:22px 12px 15px;
    }

    .logo{
        font-size:29px;
        letter-spacing:2px;
    }

    nav{
        gap:8px;
    }

    nav a{
        padding:8px 13px;
        font-size:12px;
    }

    .game-header{
        padding:50px 15px 25px;
    }

    .game-header h1{
        font-size:32px;
    }

    .game-wrapper{
        padding:0 12px;
    }

    .game-inner{
        padding:15px;
    }

    #gameArea{
        height:400px;
    }

    .tape{
        display:none;
    }

}

@media(max-width:400px){

    .logo{
        font-size:25px;
    }

    nav a{
        padding:7px 10px;
        font-size:11px;
    }

    .game-header h1{
        font-size:29px;
    }

    #gameArea{
        height:360px;
    }

    .score-box{
        min-width:105px;
    }

}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none !important;
        transition:none !important;
    }

}

</style>
</head>

<body>

<!-- DECORATION -->

<div class="decor decor1">✿</div>
<div class="decor decor2">♡</div>
<div class="decor decor3">✦</div>
<div class="decor decor4">˚₊‧</div>


<!-- TOP BOARD -->

<div class="top-area">

    <div class="main-board">

        <div class="board-inner">

            <div class="logo">
                ART GALLERY
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="about.html">About</a>
                <a href="game.html" class="active">🎮 Game</a>
            </nav>

        </div>

    </div>

</div>


<!-- GAME TITLE -->

<section class="game-header">

    <h1>Catch the Stars ✦</h1>

    <p>
        A tiny game for a little break from the gallery ♡
    </p>

</section>


<!-- GAME -->

<div class="game-wrapper">

    <div class="game-card">

        <div class="game-inner">

            <div class="tape left"></div>
            <div class="tape right"></div>


            <!-- SCORE -->

            <div class="score-area">

                <div class="score-box">
                    <span>Score</span>
                    <strong id="score">0</strong>
                </div>

                <div class="score-box">
                    <span>Time</span>
                    <strong id="time">30</strong>
                </div>

                <div class="score-box">
                    <span>Best</span>
                    <strong id="best">0</strong>
                </div>

            </div>


            <!-- GAME AREA -->

            <div id="gameArea"></div>


            <!-- MESSAGE -->

            <div class="message" id="message">
                Klik tombol mulai untuk bermain ✦
            </div>


            <!-- BUTTON -->

            <button class="start-btn" id="startBtn">
                Mulai Game
            </button>


            <!-- INSTRUCTION -->

            <div class="instruction">
                <b>Cara bermain:</b>
                Klik bintang ✦ sebanyak mungkin sebelum waktu habis!
            </div>

        </div>

    </div>

</div>


<footer>
    Made with ♡ for my art gallery
</footer>


<script>

const gameArea = document.getElementById("gameArea");
const scoreElement = document.getElementById("score");
const timeElement = document.getElementById("time");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const startButton = document.getElementById("startBtn");

let score = 0;
let timeLeft = 30;
let gameRunning = false;
let timer;
let starTimer;


/* BEST SCORE */

let bestScore = Number(localStorage.getItem("artGalleryBestScore")) || 0;

bestElement.textContent = bestScore;


/* START GAME */

function startGame(){

    if(gameRunning){
        return;
    }

    score = 0;
    timeLeft = 30;
    gameRunning = true;

    scoreElement.textContent = score;
    timeElement.textContent = timeLeft;

    messageElement.textContent = "Cepat! Tangkap semua bintangnya ✦";

    startButton.textContent = "Sedang Bermain...";

    startButton.disabled = true;

    gameArea.innerHTML = "";

    createStar();

    timer = setInterval(function(){

        timeLeft--;

        timeElement.textContent = timeLeft;

        if(timeLeft <= 0){
            endGame();
        }

    },1000);

}


/* CREATE STAR */

function createStar(){

    if(!gameRunning){
        return;
    }

    const oldStar = document.querySelector(".star");

    if(oldStar){
        oldStar.remove();
    }


    const star = document.createElement("div");

    star.className = "star";
    star.textContent = "✦";


    const areaWidth = gameArea.clientWidth;
    const areaHeight = gameArea.clientHeight;


    const maxX = areaWidth - 65;
    const maxY = areaHeight - 65;


    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;


    star.style.left = randomX + "px";
    star.style.top = randomY + "px";


    star.addEventListener("click", function(){

        if(!gameRunning){
            return;
        }

        score++;

        scoreElement.textContent = score;

        createStar();

    });


    gameArea.appendChild(star);

}


/* END GAME */

function endGame(){

    gameRunning = false;

    clearInterval(timer);

    const star = document.querySelector(".star");

    if(star){
        star.remove();
    }


    if(score > bestScore){

        bestScore = score;

        localStorage.setItem(
            "artGalleryBestScore",
            bestScore
        );

        bestElement.textContent = bestScore;

        messageElement.textContent =
            "New best score! ✨ Kamu hebat!";

    }else{

        messageElement.textContent =
            "Waktu habis! Kamu mendapat " +
            score +
            " poin ✦";

    }


    startButton.textContent = "Main Lagi";

    startButton.disabled = false;

}


/* BUTTON */

startButton.addEventListener("click", startGame);

</script>

</body>
</html>
