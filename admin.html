<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin - 0urnss</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #59484d;
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 90% 20%, rgba(255,255,255,.7) 0 2px, transparent 3px),

    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .decor {
      position: fixed;
      z-index: 0;
      pointer-events: none;
      color: rgba(128,89,101,.35);
      font-size: 25px;
    }

    .decor.one {
      top: 130px;
      left: 5%;
    }

    .decor.two {
      top: 380px;
      right: 5%;
    }

    .decor.three {
      bottom: 80px;
      left: 8%;
    }

    .top-area {
      padding: 28px 20px 0;
      position: relative;
      z-index: 2;
    }

    .main-board {
      max-width: 1050px;
      margin: auto;
      background: #d9aeb9;
      border: 2px solid #a97682;
      border-radius: 28px;
      padding: 12px;
      box-shadow: 0 8px 0 rgba(169,118,130,.35);
    }

    .board-inner {
      position: relative;
      overflow: hidden;
      background: #f6dce2;
      border: 2px solid #c28c99;
      border-radius: 21px;
      padding: 22px 20px 18px;
    }

    .board-inner::before {
      content: "✿";
      position: absolute;
      top: 8px;
      left: 20px;
      color: #b27c89;
      font-size: 22px;
    }

    .board-inner::after {
      content: "♡";
      position: absolute;
      top: 8px;
      right: 20px;
      color: #b27c89;
      font-size: 22px;
    }

    .logo {
      text-align: center;
      font-family: Georgia, serif;
      font-size: 38px;
      color: #805965;
      letter-spacing: 1px;
      margin: 0 0 18px;
    }

    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a {
      background: #f8edf0;
      border: 2px solid #c28f9b;
      border-radius: 13px;
      padding: 9px 17px;
      font-size: 14px;
      box-shadow: 0 4px 0 #c28f9b;
      transition: .2s;
    }

    nav a:hover {
      background: #f3cbd5;
      transform: translateY(-2px);
    }

    .container {
      max-width: 900px;
      margin: 38px auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }

    .outer-card {
      background: #d9aeb9;
      border: 2px solid #a97682;
      border-radius: 27px;
      padding: 12px;
      box-shadow: 0 8px 0 rgba(169,118,130,.3);
    }

    .inner-card {
      background: #fff8f9;
      border: 2px solid #c28c99;
      border-radius: 20px;
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      color: #805965;
      font-family: Georgia, serif;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #806a70;
      font-size: 14px;
    }

    .login-box {
      max-width: 450px;
      margin: 20px auto;
    }

    .login-box h2 {
      text-align: center;
      color: #805965;
      font-family: Georgia, serif;
    }

    .form-box {
      background: #fdf0f3;
      border: 2px solid #e2b9c3;
      border-radius: 17px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .form-box h2 {
      margin-top: 0;
      color: #805965;
      font-family: Georgia, serif;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      font-size: 14px;
      color: #674f56;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border: 2px solid #d7adb8;
      border-radius: 11px;
      background: white;
      color: #59484d;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,

    textarea {

      background: #fff;

    .button-row {

      margin-top: 18px;

    button:hover {

    }

    button:disabled {

      transform: none;
    }

    .btn-danger {

    }

    .btn-secondary {
      background: #f8edf0;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;

      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .status.show {
      display: block;
    }

    .status.info {

      border: 2px solid #d7adb8;

    .status.success {

    .status.error {

      padding: 12px;

      line-height: 1.5;

    .diagnostic.show {

    .diagnostic strong {

    }

    .diagnostic code {
      background: #f5e8eb;

      border-radius: 5px;
      word-break: break-all;
    }

    .section-title {
      color: #805965;
      font-family: Georgia, serif;
      margin: 0 0 15px;
    }

    .art-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px;

    .art-item {
      background: #fff;

      border-radius: 15px;
      padding: 12px;
      overflow: hidden;

    .art-item img {
      width: 100%;

      font-family: Georgia, serif;
    }

      border: 1px solid #d3a1ad;

      color: #806a70;

      max-width: 180px;
      max-height: 180px;
      border-radius: 10px;
      border: 2px solid #d7adb8;
      object-fit: cover;

    }

    .hint {

      color: #876f76;
    }

      .top-area {

      }

      nav a {

      }

      .container {

        padding: 0 12px;
      }

      .inner-card {
        padding: 20px 15px;
      }

      .art-list {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .art-item {
        padding: 8px;
      }

      .art-item img {
        height: 145px;

        font-size: 16px;
      }

  </style>

  <div class="top-area">
    <div class="main-board">
      <div class="board-inner">

        <nav>
          <a href="index.html">Home</a>
          <a href="gallery.html">Gallery</a>
          <a href="about.html">About</a>

        </nav>

  <main class="container">

          <p class="subtitle" style="text-align:center;">
            Login untuk mengelola artwork.

          <!-- FORM -->

            <h2 id="formTitle">

      </div>
    </div>

  </main>


  <footer>
    made with ♡ by 0urnss
  </footer>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://ojjpssupaoputowjvokm.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_dFkIBbLpaQm2H8VrkyQqLw_TTsrC_fy";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /* ==========================================
     ELEMENTS
  ========================================== */

  const loginSection =
    document.getElementById("loginSection");

  const adminSection =
    document.getElementById("adminSection");

  const loginEmail =
    document.getElementById("loginEmail");

  const loginPassword =
    document.getElementById("loginPassword");

  const loginBtn =
    document.getElementById("loginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const userEmail =
    document.getElementById("userEmail");

  const loginStatus =
    document.getElementById("loginStatus");

  const saveStatus =
    document.getElementById("saveStatus");

  const diagnostic =
    document.getElementById("diagnostic");

  const titleInput =
    document.getElementById("title");

  const categoryInput =
    document.getElementById("category");

  const imageInput =
    document.getElementById("image");

  const descriptionInput =
    document.getElementById("description");

  const saveBtn =
    document.getElementById("saveBtn");

  const cancelBtn =
    document.getElementById("cancelBtn");

  const editingId =
    document.getElementById("editingId");

  const preview =
    document.getElementById("preview");

  const artList =
    document.getElementById("artList");

  const formTitle =
    document.getElementById("formTitle");


  /* ==========================================
     STATUS
  ========================================== */

  function showStatus(
    element,
    message,
    type = "info"
  ) {

    element.textContent =
      message;

    element.className =
      "status show " + type;

  }


  function hideStatus(element) {

    element.textContent =
      "";

    element.className =
      "status";

  }


  function showDiagnostic(
    title,
    error,
    extra = ""
  ) {

    let message =
      error?.message ||
      String(error);

    let details =
      error?.details ||
      "";

    let hint =
      error?.hint ||
      "";

    let code =
      error?.code ||
      "";

    diagnostic.innerHTML = `
      <strong>${escapeHtml(title)}</strong><br><br>

      <b>Message:</b>
      ${escapeHtml(message)}
      <br>

      ${
        code
          ? `<b>Code:</b> ${escapeHtml(code)}<br>`
          : ""
      }

      ${
        details
          ? `<b>Details:</b> ${escapeHtml(details)}<br>`
          : ""
      }

      ${
        hint
          ? `<b>Hint:</b> ${escapeHtml(hint)}<br>`
          : ""
      }

      ${
        extra
          ? `<br>${escapeHtml(extra)}`
          : ""
      }
    `;

    diagnostic.classList.add("show");

    console.error(
      "SUPABASE ERROR:",
      error
    );

  }


  /* ==========================================
     LOGIN
  ========================================== */

  async function checkLogin() {

    const result =
      await supabaseClient.auth.getSession();

    const session =
      result.data.session;

    if (session) {

      showAdmin(session);

    } else {

      showLogin();

    }

  }


  function showLogin() {

    loginSection.style.display =
      "block";

    adminSection.style.display =
      "none";

  }


  function showAdmin(session) {

    loginSection.style.display =
      "none";

    adminSection.style.display =
      "block";

    userEmail.textContent =
      session.user.email || "";

    loadArtworks();

  }


  loginBtn.addEventListener(
    "click",
    async () => {

      hideStatus(loginStatus);

      const email =
        loginEmail.value.trim();

      const password =
        loginPassword.value;


      if (!email || !password) {

        showStatus(
          loginStatus,
          "Email dan password harus diisi.",
          "error"
        );

        return;

      }


      loginBtn.disabled =
        true;

      loginBtn.textContent =
        "Logging in...";


      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });


      loginBtn.disabled =
        false;

      loginBtn.textContent =
        "Login";


      if (error) {

        showStatus(
          loginStatus,
          "Login gagal.",
          "error"
        );

        return;

      }


      showAdmin(
        data.session
      );

    }
  );


  logoutBtn.addEventListener(
    "click",
    async () => {

      await supabaseClient.auth.signOut();

      showLogin();

    }
  );


  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session) {

        showAdmin(session);

      } else {

        showLogin();

      }

    }
  );


  /* ==========================================
     COMPRESS IMAGE
  ========================================== */

  function compressImage(file) {

    return new Promise(
      (resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload =
          event => {

            const img =
              new Image();


            img.onload =
              () => {

                let width =
                  img.width;

                let height =
                  img.height;


                const maxSize =
                  1600;


                if (
                  width > maxSize ||
                  height > maxSize
                ) {

                  if (width > height) {

                    height =
                      Math.round(
                        height *
                        maxSize /
                        width
                      );

                    width =
                      maxSize;

                  } else {

                    width =
                      Math.round(
                        width *
                        maxSize /
                        height
                      );

                    height =
                      maxSize;

                  }

                }


                const canvas =
                  document.createElement(
                    "canvas"
                  );


                canvas.width =
                  width;

                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );


                canvas.toBlob(
                  blob => {

                    if (!blob) {

                      reject(
                        new Error(
                          "Gagal membuat file hasil kompres."
                        )
                      );

                      return;

                    }


                    resolve(blob);

                  },
                  "image/jpeg",
                  0.82
                );

              };


            img.onerror =
              () => {

                reject(
                  new Error(
                    "Browser tidak bisa membaca gambar."
                  )
                );

              };


            img.src =
              event.target.result;

          };


        reader.onerror =
          () => {

            reject(
              new Error(
                "File gagal dibaca."
              )
            );

          };


        reader.readAsDataURL(
          file
        );

      }
    );

  }


  /* ==========================================
     PREVIEW
  ========================================== */

  imageInput.addEventListener(
    "change",
    () => {

      const file =
        imageInput.files[0];


      if (!file) {

        preview.src =
          "";

        preview.classList.remove(
          "show"
        );

        return;

      }


      const url =
        URL.createObjectURL(
          file
        );


      preview.src =
        url;

      preview.classList.add(
        "show"
      );

    }
  );


  /* ==========================================
     TEST STORAGE SESSION
  ========================================== */

  async function checkStorageSession() {

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if (error) {

      throw error;

    }


    if (!data.session) {

      throw new Error(
        "Tidak ada session login."
      );

    }


    return data.session;

  }


  /* ==========================================
     UPLOAD IMAGE
  ========================================== */

  async function uploadImage(file) {

    if (!file) {

      throw new Error(
        "File gambar tidak ditemukan."
      );

    }


    const session =
      await checkStorageSession();


    showStatus(
      saveStatus,
      "Mengompres foto...",
      "info"
    );


    const compressed =
      await compressImage(
        file
      );


    console.log(
      "Original:",
      file.size,
      "bytes"
    );

    console.log(
      "Compressed:",
      compressed.size,
      "bytes"
    );

    console.log(
      "Logged user:",
      session.user.email
    );


    showStatus(
      saveStatus,
      "Mengupload foto...",
      "info"
    );


    const fileName =
      "artwork-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2, 8) +
      ".jpg";


    const {
      data,
      error
    } =
      await supabaseClient.storage
        .from("artworks")
        .upload(
          fileName,
          compressed,
          {
            contentType:
              "image/jpeg",

            cacheControl:
              "3600",

            upsert:
              false
          }
        );


    if (error) {

      showDiagnostic(
        "UPLOAD STORAGE GAGAL",
        error,
        "Bucket yang digunakan: artworks"
      );

      throw error;

    }


    if (!data?.path) {

      const error =
        new Error(
          "Supabase tidak mengembalikan path file."
        );

      showDiagnostic(
        "PATH FILE TIDAK DITEMUKAN",
        error
      );

      throw error;

    }


    const {
      data: publicData
    } =
      supabaseClient.storage
        .from("artworks")
        .getPublicUrl(
          data.path
        );


    if (
      !publicData ||
      !publicData.publicUrl
    ) {

      const error =
        new Error(
          "Public URL gambar tidak berhasil dibuat."
        );

      showDiagnostic(
        "PUBLIC URL GAGAL",
        error
      );

      throw error;

    }


    return publicData.publicUrl;

  }


  /* ==========================================
     SAVE
  ========================================== */

  saveBtn.addEventListener(
    "click",
    async () => {

      hideStatus(
        saveStatus
      );

      diagnostic.classList.remove(
        "show"
      );


      const title =
        titleInput.value.trim();

      const category =
        categoryInput.value;

      const description =
        descriptionInput.value.trim();

      const file =
        imageInput.files[0];

      const id =
        editingId.value;


      if (!title) {

        showStatus(
          saveStatus,
          "Title belum diisi.",
          "error"
        );

        return;

      }


      if (!category) {

        showStatus(
          saveStatus,
          "Pilih kategori artwork.",
          "error"
        );

        return;

      }


      if (!id && !file) {

        showStatus(
          saveStatus,
          "Pilih foto artwork terlebih dahulu.",
          "error"
        );

        return;

      }


      saveBtn.disabled =
        true;

      cancelBtn.disabled =
        true;


      try {

        let imageUrl =
          null;


        /* ADD */

        if (!id) {

          imageUrl =
            await uploadImage(
              file
            );


          showStatus(
            saveStatus,
            "Foto berhasil diupload. Menyimpan data artwork...",
            "info"
          );


          const {
            error
          } =
            await supabaseClient
              .from("artworks")
              .insert([
                {
                  title:
                    title,

                  category:
                    category,

                  image_url:
                    imageUrl,

                  description:
                    description ||
                    null
                }
              ]);


          if (error) {

            showDiagnostic(
              "DATABASE INSERT GAGAL",
              error,
              "Foto sudah mungkin berhasil masuk Storage, tetapi data artwork gagal masuk tabel."
            );

            throw error;

          }


          showStatus(
            saveStatus,
            "Artwork berhasil ditambahkan! ♡",
            "success"
          );

        }


        /* EDIT */

        else {

          const updateData = {

            title:
              title,

            category:
              category,

            description:
              description ||
              null

          };


          if (file) {

            imageUrl =
              await uploadImage(
                file
              );

            updateData.image_url =
              imageUrl;

          }


          const {
            error
          } =
            await supabaseClient
              .from("artworks")
              .update(
                updateData
              )
              .eq(
                "id",
                id
              );


          if (error) {

            showDiagnostic(
              "DATABASE UPDATE GAGAL",
              error
            );

            throw error;

          }


          showStatus(
            saveStatus,
            "Artwork berhasil diperbarui! ♡",
            "success"
          );

        }


        resetForm();

        await loadArtworks();


      } catch (error) {

        console.error(
          "FINAL ERROR:",
          error
        );


        if (
          !diagnostic.classList.contains(
            "show"
          )
        ) {

          showDiagnostic(
            "PROSES GAGAL",
            error
          );

        }


        showStatus(
          saveStatus,
          "Gagal. Lihat detail error di bawah.",
          "error"
        );

      }


      saveBtn.disabled =
        false;

      cancelBtn.disabled =
        false;

    }
  );


  /* ==========================================
     LOAD ARTWORKS
  ========================================== */

  async function loadArtworks() {

    artList.innerHTML =
      '<div class="empty">Memuat artwork...</div>';


    const {
      data,
      error
    } =
      await supabaseClient
        .from("artworks")
        .select("*")
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error) {

      artList.innerHTML =
        '<div class="empty">Gagal memuat artwork.</div>';

      showDiagnostic(
        "LOAD ARTWORK GAGAL",
        error
      );

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      artList.innerHTML =
        '<div class="empty">Belum ada artwork.</div>';

      return;

    }


    artList.innerHTML =
      data.map(
        art => {

          return `
            <div class="art-item">

              <img
                src="${escapeAttribute(art.image_url)}"
                alt="${escapeAttribute(art.title)}"
                loading="lazy"
              >

              <h3>
                ${escapeHtml(art.title)}
              </h3>

              <span class="category">
                ${escapeHtml(art.category)}
              </span>

              <div class="description">
                ${
                  art.description
                    ? escapeHtml(
                        art.description
                      )
                    : "Tidak ada deskripsi."
                }
              </div>

              <div class="button-row">

                <button
                  type="button"
                  class="edit-btn"
                  data-id="${art.id}"
                >
                  Edit
                </button>

                <button
                  type="button"
                  class="btn-danger delete-btn"
                  data-id="${art.id}"
                >
                  Delete
                </button>

              </div>

            </div>
          `;

        }
      ).join("");


    document
      .querySelectorAll(
        ".edit-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              editArtwork(
                button.dataset.id
              );

            }
          );

        }
      );


    document
      .querySelectorAll(
        ".delete-btn"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              deleteArtwork(
                button.dataset.id
              );

            }
          );

        }
      );

  }


  /* ==========================================
     EDIT
  ========================================== */

  async function editArtwork(id) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("artworks")
        .select("*")
        .eq(
          "id",
          id
        )
        .single();


    if (error) {

      showDiagnostic(
        "EDIT GAGAL",
        error
      );

      return;

    }


    editingId.value =
      data.id;

    titleInput.value =
      data.title || "";

    categoryInput.value =
      data.category || "";

    descriptionInput.value =
      data.description || "";


    preview.src =
      data.image_url || "";

    preview.classList.add(
      "show"
    );


    formTitle.textContent =
      "Edit Artwork";

    saveBtn.textContent =
      "Update Artwork";

    cancelBtn.style.display =
      "inline-block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ==========================================
     DELETE
  ========================================== */

  async function deleteArtwork(id) {

    const yakin =
      confirm(
        "Yakin ingin menghapus artwork ini?"
      );


    if (!yakin) {

      return;

    }


    showStatus(
      saveStatus,
      "Menghapus artwork...",
      "info"
    );


    const {
      error
    } =
      await supabaseClient
        .from("artworks")
        .delete()
        .eq(
          "id",
          id
        );


    if (error) {

      showDiagnostic(
        "DELETE GAGAL",
        error
      );

      showStatus(
        saveStatus,
        "Gagal menghapus artwork.",
        "error"
      );

      return;

    }


    showStatus(
      saveStatus,
      "Artwork berhasil dihapus.",
      "success"
    );


    await loadArtworks();

  }


  /* ==========================================
     RESET
  ========================================== */

  cancelBtn.addEventListener(
    "click",
    resetForm
  );


  function resetForm() {

    editingId.value =
      "";

    titleInput.value =
      "";

    categoryInput.value =
      "";

    descriptionInput.value =
      "";

    imageInput.value =
      "";

    preview.src =
      "";

    preview.classList.remove(
      "show"
    );

    formTitle.textContent =
      "Add Artwork";

    saveBtn.textContent =
      "Save Artwork";

    cancelBtn.style.display =
      "none";

  }


  /* ==========================================
     ESCAPE HTML
  ========================================== */

  function escapeHtml(value) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  function escapeAttribute(value) {

    return escapeHtml(
      value
    );

  }


  /* ==========================================
     START
  ========================================== */

  checkLogin();

</script>

</body>
